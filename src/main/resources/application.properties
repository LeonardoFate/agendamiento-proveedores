spring.application.name=agendamiento-proveedores

# ============================================
# CONFIGURACIÓN SQL SERVER CORREGIDA
# ============================================

# ✅ CAMBIO CRÍTICO: Usar la base de datos específica, NO master
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=agendamiento_proveedores;trustServerCertificate=true;encrypt=false

# Credenciales
spring.datasource.username=sa
spring.datasource.password=TuPasswordSegura123

# Driver
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ============================================
# CONFIGURACIÓN JPA/HIBERNATE
# ============================================

# ✅ CAMBIO: create para la primera vez (no create-drop)
spring.jpa.hibernate.ddl-auto=create

# SQL visible (para debugging)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configuración adicional
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ✅ Configuración específica para SQL Server
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# ============================================
# RESTO DE CONFIGURACIONES (sin cambios)
# ============================================

# JWT
app.jwt.secret=miClaveSecretaSuperSeguraParaPruebasDeDesarrollo12345
app.jwt.expiration-ms=86400000

# Email
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=tu_correo@gmail.com
spring.mail.password=tu_password_app
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Archivos
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=./uploads

# Scheduling
spring.task.scheduling.pool.size=2

# Zona horaria
spring.jackson.time-zone=America/Guayaquil